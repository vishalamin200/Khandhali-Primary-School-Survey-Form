<!doctype html><html lang="gu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>સર્વેક્ષણનું પરિણામ – શ્રી જ્ઞાન સ્વામી પ્રાથમિક શાળા ખાંધલી</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600&family=Rasa:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;display:flex;gap:.75rem;align-items:baseline;width:100%}
.opt{position:relative;cursor:pointer}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.err{display:none;margin:.75rem 0 0;font-size:.95rem;color:var(--bad)}
.q.bad .err{display:block}
.progwrap{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
#bar{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
button{font:inherit;cursor:pointer}
button:focus-visible,.opt input:focus-visible+.dot{outline:3px solid var(--focus);outline-offset:3px}
#done:focus{outline:none}
[hidden]{display:none!important}
.sr{display:grid;grid-template-columns:7rem 1fr 2.5rem;gap:.6rem;align-items:center;margin:.35rem 0;font-size:.95rem}
.sb{height:10px;border-radius:5px;background:var(--track);overflow:hidden}.sb i{display:block;height:100%;background:var(--accent)}
.sc{text-align:right;font-variant-numeric:tabular-nums}
.sqt{font-weight:600;margin:1.2rem 0 .4rem}.tot{font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

:root{--bg:#f3f0f8;--paper:#ffffff;--ink:#1f1a36;--mute:#5a5474;--accent:#6a3fd1;--gold:#b8872b;--k1:#ff8a00;--k2:#e2336b;--k3:#12a5a0;--k4:#6a3fd1;--line:#e3deee;--track:#e6e1f0;--bad:#c4263e;--focus:#b8872b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120e20;--paper:#1c1730;--ink:#f1edfb;--mute:#b0a8c8;--accent:#b9a0ff;--line:#322a4c;--track:#322a4c;--bad:#ff8fa3}}
:root[data-theme="dark"]{--bg:#120e20;--paper:#1c1730;--ink:#f1edfb;--mute:#b0a8c8;--accent:#b9a0ff;--line:#322a4c;--track:#322a4c;--bad:#ff8fa3}
body{font-family:"Hind Vadodara","Noto Sans Gujarati",sans-serif;font-size:1.06rem;line-height:1.6;padding:1.5rem 1rem 3rem}
.sheet{max-width:700px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px;box-shadow:0 14px 34px rgba(31,26,54,.12)}
.inner{border:2px solid var(--gold);border-radius:3px;overflow:hidden}
.sky{position:relative;overflow:hidden;background:linear-gradient(160deg,#ff8a00 0%,#e2336b 55%,#6a3fd1 100%);color:#fff;text-align:center;padding:2rem 1.25rem 3.4rem}
.sky svg.k{position:absolute;pointer-events:none}
.seal{width:66px;height:66px;display:block;margin:0 auto .6rem;position:relative}
h1{font-family:"Rasa","Noto Serif Gujarati",serif;font-weight:700;font-size:clamp(1.65rem,5.6vw,2.4rem);line-height:1.2;margin:0 auto;max-width:15em;position:relative;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.code{position:relative;display:inline-block;margin:.8rem 0 0;background:rgba(255,255,255,.2);padding:.2rem .9rem;border-radius:6px}.code b{letter-spacing:.04em}
.wave{display:block;width:100%;height:28px;margin-top:-28px;position:relative}
.body{padding:.4rem 1.6rem 1.6rem;background-image:repeating-linear-gradient(45deg,transparent 0 10px,color-mix(in srgb,var(--gold) 5%,transparent) 10px 11px)}
.sub{font-family:"Rasa",serif;font-size:1.5rem;font-weight:600;margin:0;text-align:center}
.intro{color:var(--mute);margin:.3rem auto 0;max-width:32em;text-align:center}
.prog{margin:1.3rem 0 .3rem}.progt{margin:0 0 .4rem;color:var(--mute);font-size:.92rem}
#bar{background:linear-gradient(90deg,var(--k1),var(--k2),var(--k3))}
.q{padding:1.3rem 0;border-bottom:1px solid var(--line)}
.q:nth-of-type(4n+1){--c:var(--k1)}.q:nth-of-type(4n+2){--c:var(--k2)}.q:nth-of-type(4n+3){--c:var(--k3)}.q:nth-of-type(4n){--c:var(--k4)}
.qn{flex:none;width:2rem;height:2rem;display:grid;place-items:center;position:relative;color:#fff;font-weight:700;font-family:"Rasa",serif;font-size:1.15rem;margin:.05rem .2rem 0}
.qn::before{content:"";position:absolute;inset:0;background:var(--c);transform:rotate(45deg);border-radius:4px;z-index:0}
.qn{z-index:0}.qn{isolation:isolate}.qn::before{z-index:-1}
.qt{font-weight:600;font-size:1.13rem}.req{color:var(--k2)}
.opts{display:flex;flex-direction:column;gap:.45rem;margin:.85rem 0 0 2.75rem;max-width:22rem}
.opt{display:flex;align-items:center;gap:.75rem;padding:.55rem .9rem;border:1px solid var(--line);border-radius:8px;transition:background .15s,border-color .15s,color .15s}
.opt:hover{border-color:var(--c)}
.dot{width:.95rem;height:.95rem;border:2px solid var(--c);transform:rotate(45deg);flex:none;transition:background .15s}
.opt:has(input:checked){background:var(--c);border-color:var(--c);color:#fff;font-weight:600}
.opt:has(input:checked) .dot{background:#fff;border-color:#fff}
.q.bad .qt{color:var(--bad)}.q.bad .opt{border-color:var(--bad)}
.foot{padding-top:1.4rem}.acts{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.send{border:0;border-radius:999px;padding:.75rem 2rem;font-weight:700;font-size:1.08rem;color:#fff;background:linear-gradient(90deg,var(--k2),var(--k4));box-shadow:0 6px 16px rgba(226,51,107,.3)}
.send:disabled{opacity:.6}
.clear{background:none;border:0;color:var(--accent);padding:.5rem;text-decoration:underline}
.note{color:var(--bad);margin:0 0 1rem}
.done{text-align:center;padding:2.5rem 0 1rem}.big{font-family:"Rasa",serif;font-size:2.7rem;font-weight:700;margin:0;color:var(--k2)}
.sum{margin-top:1.5rem;border-top:2px solid var(--gold);padding-top:1rem}.sum h2{font-family:"Rasa",serif;margin:0;color:var(--accent)}.sumnote{color:var(--mute);margin:.1rem 0 0;font-size:.9rem}
@media (max-width:480px){.opts{margin-left:0}.body{padding:.4rem 1rem 1.3rem}}

.login{max-width:22rem;margin:1.5rem auto .5rem;text-align:center}
.login input{width:100%;font:inherit;padding:.7rem .9rem;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);margin:.6rem 0 1rem}
.stats{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin:1rem 0 .5rem}
.tot{font-family:"Rasa",serif;font-size:1.6rem;font-weight:700;margin:0}
.tools{display:flex;gap:.5rem;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:var(--paper);color:var(--accent);border-radius:999px;padding:.45rem 1rem;font-weight:600}
.card{padding:1.2rem 0;border-bottom:1px solid var(--line)}
.card:nth-of-type(4n+1){--c:var(--k1)}.card:nth-of-type(4n+2){--c:var(--k2)}.card:nth-of-type(4n+3){--c:var(--k3)}.card:nth-of-type(4n){--c:var(--k4)}
.ct{font-weight:600;margin:0 0 .6rem;display:flex;gap:.7rem;align-items:baseline}
.sr{grid-template-columns:7rem 1fr 4.5rem}
.sb{height:14px;border-radius:7px}.sb i{background:var(--c);border-radius:7px;transition:width .5s ease}
.tw{overflow-x:auto;margin-top:1rem;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.95rem;min-width:900px}
th,td{padding:.55rem .7rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:color-mix(in srgb,var(--gold) 10%,var(--paper));font-weight:600}
h2{font-family:"Rasa",serif;margin:2rem 0 0;color:var(--accent)}
.empty{text-align:center;color:var(--mute);padding:2rem 0}
</style></head><body><main class="sheet"><div class="inner"><header class="sky"><svg class="seal" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="rgba(255,255,255,.15)" stroke="#ffd98a" stroke-width="2"/><circle cx="32" cy="32" r="24" fill="none" stroke="#ffd98a" stroke-width="1" stroke-dasharray="2 3"/><path d="M16 40c5-2 11-2 16 1 5-3 11-3 16-1V22c-5-2-11-2-16 1-5-3-11-3-16-1z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M32 23v18" stroke="#fff" stroke-width="2"/></svg><h1>શ્રી જ્ઞાન સ્વામી પ્રાથમિક શાળા ખાંધલી</h1><p class="code">શાળા કોડ: <b>૨૪૧૫૦૧૦૨૧૦૧</b></p></header><svg class="wave" viewBox="0 0 700 28" preserveAspectRatio="none" aria-hidden="true"><path d="M0 28V14C120 0 230 26 350 14S580 0 700 14V28Z" fill="var(--paper)"/></svg>
<div class="body"><p class="sub">સર્વેક્ષણનું પરિણામ</p>
<form id="login" class="login" novalidate hidden><label for="pw">પરિણામ જોવા માટે પાસવર્ડ લખો</label><span class="progt" style="display:block;margin-top:.2rem">એક વાર પ્રવેશ કર્યા પછી આ ઉપકરણ પર ૧૦ દિવસ સુધી ફરી પાસવર્ડ નહીં પૂછાય.</span><input id="pw" type="password" autocomplete="current-password"><p id="lerr" class="note" role="alert" hidden></p><button class="send" id="lbtn">પરિણામ જુઓ</button></form>
<section id="res" hidden>
<div class="stats"><p class="tot" id="tot"></p><div class="tools"><button type="button" id="refresh">તાજું કરો</button><button type="button" id="csv">બધા જવાબો ફાઇલમાં ડાઉનલોડ કરો</button><button type="button" id="logout">બહાર નીકળો</button></div></div>
<p class="progt" id="upd"></p>
<div id="charts"></div>
<h2>બધા જવાબો</h2>
<div class="tw"><table><thead><tr><th>ક્રમ</th><th>તારીખ અને સમય</th><th>વાલીનું નામ</th><th>વિદ્યાર્થીનું નામ</th><th>ધોરણ</th><th>પ્રશ્ન ૧</th><th>પ્રશ્ન ૨</th><th>પ્રશ્ન ૩</th><th>પ્રશ્ન ૪</th><th>પ્રશ્ન ૫</th></tr></thead><tbody id="rows"></tbody></table></div>
</section></div></div></main><script>
(function(){
const Q=[["q1", "શું તમે શાળાની મુલાકાત લીધી?", ["હા", "ના"]], ["q2", "શાળાનું મકાન અને સ્વચ્છતા કેવી લાગી?", ["સારી", "મધ્યમ", "સુધારાત્મક"]], ["q3", "શાળાનું મેદાન કેવું લાગ્યું?", ["સારું", "મધ્યમ", "સુધારાત્મક"]], ["q4", "પીવાના પાણીની સુવિધા કેવી છે?", ["સારી", "મધ્યમ", "સુધારાત્મક"]], ["q5", "શું વર્ગખંડમાં સ્માર્ટ ટીવી પર શૈક્ષણિક કાર્ય કરવામાં આવે છે?", ["હા", "ના"]]];
const gd=n=>String(n).replace(/\d/g,d=>"૦૧૨૩૪૫૬૭૮૯"[d]);
const $=id=>document.getElementById(id);
let tried=false;
let data=[];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=iso=>{try{return new Date(iso).toLocaleString("gu-IN",{dateStyle:"medium",timeStyle:"short"});}catch(e){return iso;}};
async function load(){
  $("lerr").hidden=true;
  let r;try{r=await fetch("/api/results",{credentials:"same-origin",cache:"no-store"});}catch(e){return err("સર્વર સાથે જોડાણ થઈ શક્યું નથી. ઇન્ટરનેટ તપાસીને ફરી પ્રયાસ કરો.");}
  if(r.status===401){$("res").hidden=true;$("login").hidden=false;$("lbtn").disabled=false;if(tried)err("પાસવર્ડ ખોટો છે. ફરી પ્રયાસ કરો.");$("pw").focus();return;}
  if(!r.ok) return err("પરિણામ લાવી શકાયું નથી. થોડી વાર પછી ફરી પ્રયાસ કરો.");
  data=(await r.json()).responses||[];
  data.sort((a,b)=>a.at<b.at?1:-1);
  $("pw").value="";
  $("login").hidden=true;$("res").hidden=false;render();
}
function err(t){$("lerr").textContent=t;$("lerr").hidden=false;$("login").hidden=false;}
function render(){
  const n=data.length;$("tot").textContent="કુલ જવાબ: "+gd(n);
  $("upd").textContent="છેલ્લે તાજું કર્યું: "+fmt(new Date().toISOString());
  if(!n){$("charts").innerHTML='<p class="empty">હજુ સુધી કોઈ જવાબ મળ્યો નથી.</p>';$("rows").innerHTML="";return;}
  $("charts").innerHTML=Q.map((q,i)=>'<div class="card"><p class="ct"><span class="qn">'+gd(i+1)+'</span><span>'+esc(q[1])+'</span></p>'+
    q[2].map(o=>{const c=data.filter(d=>d.answers&&d.answers[q[0]]===o).length;const p=Math.round(c/n*100);
      return '<div class="sr"><span class="sl">'+esc(o)+'</span><span class="sb"><i style="width:'+p+'%"></i></span><span class="sc">'+gd(c)+' ('+gd(p)+'%)</span></div>';}).join("")+'</div>').join("");
  $("rows").innerHTML=data.map((d,i)=>'<tr><td>'+gd(n-i)+'</td><td>'+esc(fmt(d.at))+'</td>'+['parent','student','std'].map(k=>'<td>'+esc((d.info||{})[k]||'')+'</td>').join('')+Q.map(q=>'<td>'+esc((d.answers||{})[q[0]]||"")+'</td>').join("")+'</tr>').join("");
}
$("login").addEventListener("submit",async e=>{e.preventDefault();const pw=$("pw").value;if(!pw)return err("કૃપા કરીને પાસવર્ડ લખો.");
  $("lbtn").disabled=true;tried=true;
  try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({password:pw})});
    if(r.status===401){$("lbtn").disabled=false;return err("પાસવર્ડ ખોટો છે. ફરી પ્રયાસ કરો.");}
    if(!r.ok){$("lbtn").disabled=false;return err("પ્રવેશ થઈ શક્યો નથી. થોડી વાર પછી ફરી પ્રયાસ કરો.");}
  }catch(x){$("lbtn").disabled=false;return err("સર્વર સાથે જોડાણ થઈ શક્યું નથી. ઇન્ટરનેટ તપાસીને ફરી પ્રયાસ કરો.");}
  $("lbtn").disabled=false;load();});
$("logout").addEventListener("click",async()=>{try{await fetch("/api/logout",{method:"POST",credentials:"same-origin"});}catch(x){}data=[];$("res").hidden=true;$("login").hidden=false;tried=false;$("lerr").hidden=true;});
$("refresh").addEventListener("click",load);
$("csv").addEventListener("click",()=>{
  const cell=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const lines=[["ક્રમ","તારીખ અને સમય","વાલીનું નામ","વિદ્યાર્થીનું નામ","ધોરણ"].concat(Q.map(q=>q[1])).map(cell).join(",")];
  data.slice().reverse().forEach((d,i)=>lines.push([i+1,fmt(d.at),(d.info||{}).parent||"",(d.info||{}).student||"",(d.info||{}).std||""].concat(Q.map(q=>(d.answers||{})[q[0]]||"")).map(cell).join(",")));
  const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="school-survey-responses.csv";document.body.appendChild(a);a.click();a.remove();
});
load();
})();
</script></body></html>
